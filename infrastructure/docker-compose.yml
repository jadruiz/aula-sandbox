# Aula del curso Ecosistemas Inteligentes.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# (los scripts de scripts/ hacen esto por ti). Todos los puertos se publican
# SOLO en 127.0.0.1: nada queda expuesto a la red del salón.
#
# Servicios que arrancan siempre:   lab (Jupyter), langflow, redis
# Servicios bajo perfil:            letta (--profile memoria), flowise (--profile flowise)

name: aula-sandbox

services:

  lab:
    # JupyterLab + terminal con CrewAI, LangGraph, Streamlit y Langfuse. Labs M1-M6.
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: kasailabs/aula-sandbox:dev
    ports:
      - "127.0.0.1:8888:8888"   # JupyterLab
      - "127.0.0.1:8501:8501"   # streamlit run (panel del Firewall, M4)
    volumes:
      # Un solo workspace explícito. Los scripts validan y exportan AULA_WORKSPACE;
      # el valor por defecto conserva la experiencia original con trabajo/.
      - type: bind
        source: "${AULA_WORKSPACE:-../trabajo}"
        target: /workspace
    tmpfs:
      # Estado/cache efímero de CrewAI y herramientas; nunca toca $HOME o trabajo/.
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    env_file:
      - path: ../.env
        required: false
    depends_on:
      - redis

  langflow:
    # Constructor visual de agentes: la ruta de los perfiles que no programan.
    image: langflowai/langflow:latest
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LANGFLOW_DO_NOT_TRACK: "true"
      # /app/data es el HOME de LangFlow y ya viene en la imagen como 1000:0 775,
      # así que el volumen nombrado nace con dueño correcto. Un directorio inventado
      # (p. ej. /datos) nacería root:root 755 y el arranque moriría con
      # PermissionError al escribir secret_key, porque LangFlow corre con uid 1000.
      LANGFLOW_CONFIG_DIR: /app/data
      # La imagen trae LANGFLOW_AUTO_LOGIN=false y desde 1.12 eso exige usuario y
      # contraseña de superusuario, así que sin esto el contenedor no arranca.
      # El aula abre LangFlow sin login: sólo escucha en 127.0.0.1.
      LANGFLOW_AUTO_LOGIN: "true"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - langflow-datos:/app/data    # los flujos sobreviven a un reinicio

  redis:
    # Memoria compartida del Lab M5 (observabilidad).
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # accesible también para quien corre labs fuera del contenedor

  letta:
    # Memoria persistente de agentes (demo de M5). Arranca solo con: --profile memoria
    profiles: ["memoria"]
    image: letta/letta:latest
    ports:
      - "127.0.0.1:8283:8283"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - letta-datos:/var/lib/postgresql/data

  flowise:
    # Alternativa drag-and-drop a LangFlow. Arranca solo con: --profile flowise
    profiles: ["flowise"]
    image: flowiseai/flowise:latest
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - flowise-datos:/root/.flowise

volumes:
  langflow-datos:
  letta-datos:
  flowise-datos:
