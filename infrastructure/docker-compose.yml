# Aula del curso Ecosistemas Inteligentes.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# (los scripts de scripts/ hacen esto por ti). Todos los puertos se publican
# SOLO en 127.0.0.1: nada queda expuesto a la red del salón.
#
# Servicios que arrancan siempre:   lab (Jupyter), langflow, redis
# Servicios bajo perfil:            letta (--profile memoria), flowise (--profile flowise)

name: aula-sandbox

services:

  lab:
    # JupyterLab + terminal con CrewAI, LangGraph, Streamlit y Langfuse. Labs M1-M6.
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: kasailabs/aula-sandbox:dev
    ports:
      - "127.0.0.1:8888:8888"   # JupyterLab
      - "127.0.0.1:8501:8501"   # streamlit run (panel del Firewall, M4)
    volumes:
      # Un solo workspace explícito. Los scripts validan y exportan AULA_WORKSPACE;
      # el valor por defecto conserva la experiencia original con trabajo/.
      - type: bind
        source: "${AULA_WORKSPACE:-../trabajo}"
        target: /workspace
    tmpfs:
      # Estado/cache efímero de CrewAI y herramientas; nunca toca $HOME o trabajo/.
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    env_file:
      - path: ../.env
        required: false
    depends_on:
      - redis

  langflow-init:
    # La imagen de LangFlow corre como UID 1000 (grupo 0) y escribe su base y su llave
    # secreta en LANGFLOW_CONFIG_DIR. Un volumen nombrado nace como root; si el proceso no
    # puede escribir ahí, LangFlow cae en el arranque. Este paso corrige la propiedad del
    # volumen y termina; no expone puertos ni queda corriendo.
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:0 /app/langflow && chmod -R u+rwX,g+rwX /app/langflow"]
    volumes:
      - langflow-datos:/app/langflow

  langflow:
    # Constructor visual de agentes: la ruta de los perfiles que no programan.
    # Pin por tag y digest: el tag `latest` movió a 1.12.1 y rompió el arranque dos veces
    # (ver reports/2026-09-12). Cambiar de versión es una decisión de curso: se prueba,
    # se anota el digest nuevo y se reparte a todo el grupo a la vez (AGENTS.md, regla 3).
    image: langflowai/langflow:1.12.1@sha256:3e3cac657435f292fb5da653e8eb05b330460a99f1420e169f29413ba9d11164
    depends_on:
      langflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      LANGFLOW_DO_NOT_TRACK: "true"
      # /app/langflow existe en la imagen con propiedad 1000:0; es la ruta que la propia
      # documentación de LangFlow usa para persistir datos.
      LANGFLOW_CONFIG_DIR: /app/langflow
      # Sin pantalla de login: igual que Jupyter sin token, el puerto sólo se publica en
      # 127.0.0.1 del host (ADR-001). Con login, el primer arranque exige crear un
      # superusuario que nadie en el aula tiene forma de conocer.
      LANGFLOW_AUTO_LOGIN: "true"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - langflow-datos:/app/langflow    # los flujos sobreviven a un reinicio

  redis:
    # Memoria compartida del Lab M5 (observabilidad).
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # accesible también para quien corre labs fuera del contenedor

  letta:
    # Memoria persistente de agentes (demo de M5). Arranca solo con: --profile memoria
    profiles: ["memoria"]
    image: letta/letta:0.32.3@sha256:d27a77f3de61e88f7064f434d75ae5f2037d09d5b0518532abc41694fcc01183
    ports:
      - "127.0.0.1:8283:8283"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - letta-datos:/var/lib/postgresql/data

  flowise:
    # Alternativa drag-and-drop a LangFlow. Arranca solo con: --profile flowise
    profiles: ["flowise"]
    image: flowiseai/flowise:3.1.4@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - flowise-datos:/root/.flowise

volumes:
  langflow-datos:
  letta-datos:
  flowise-datos:
